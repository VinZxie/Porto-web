<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <style>
      .bg {
        fill: #0c0d10;
      }
      .fg {
        stroke: #f97316;
      }
      .dot {
        fill: #f97316;
      }
      @media (prefers-color-scheme: light) {
        .bg {
          fill: #ffffff;
          stroke: #ea580c;
          stroke-width: 1.5px;
          stroke-opacity: 0.25;
        }
        .fg {
          stroke: #ea580c;
        }
        .dot {
          fill: #ea580c;
        }
      }
    </style>
  </defs>

  <!-- Background Squircle Container -->
  <rect class="bg" width="40" height="40" rx="10" />

  <!-- Outer Precision Architectural V Monogram -->
  <path
    class="fg"
    d="M9 11 L20 32 L31 11"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Inner Harmonic Parallel Accent -->
  <path
    class="fg"
    d="M14.5 11 L20 21.5 L25.5 11"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.65"
    fill="none"
  />

  <!-- Central Geometric Focus Point -->
  <circle
    class="dot"
    cx="20"
    cy="27"
    r="1.4"
    opacity="0.95"
  />
</svg>
